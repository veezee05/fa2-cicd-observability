<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Lost &amp; Found Portal</title>
<style>
  :root {
    --navy: #0b1f42;
    --navy-2: #123166;
    --blue: #2563eb;
    --blue-light: #60a5fa;
    --yellow: #ffc72c;
    --yellow-dark: #e6a800;
    --bg: #eef3fb;
    --card: #ffffff;
    --text: #142033;
    --muted: #64748b;
    --border: #dbe4f3;
    --found: #16a34a;
    --lost: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  header {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: white;
    padding: 2.2rem 1.5rem 1.6rem;
    text-align: center;
    border-bottom: 4px solid var(--yellow);
  }
  header h1 { font-size: 1.9rem; margin-bottom: 0.35rem; }
  header p { color: #cbd9f5; font-size: 0.95rem; }

  nav {
    background: var(--navy-2);
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.6rem;
    flex-wrap: wrap;
  }
  nav button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.25);
    color: #dce6fb;
    padding: 0.5rem 1.1rem;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  nav button:hover { border-color: var(--yellow); color: var(--yellow); }
  nav button.active {
    background: var(--yellow);
    border-color: var(--yellow);
    color: var(--navy);
  }

  main {
    max-width: 980px;
    margin: 1.8rem auto 2rem;
    padding: 0 1rem;
  }

  .view { display: none; }
  .view.active { display: block; }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .stat-card {
    background: var(--card);
    border-radius: 10px;
    padding: 1.1rem;
    text-align: center;
    box-shadow: 0 2px 8px rgba(11,31,66,0.08);
    border-top: 3px solid var(--blue-light);
  }
  .stat-card.accent { border-top-color: var(--yellow); }
  .stat-card .num { font-size: 1.6rem; font-weight: 700; color: var(--blue); }
  .stat-card .label { font-size: 0.85rem; color: var(--muted); }

  .toolbar {
    display: flex;
    gap: 0.6rem;
    margin-bottom: 1.2rem;
    flex-wrap: wrap;
  }
  .toolbar input, .toolbar select {
    flex: 1;
    min-width: 160px;
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 0.9rem;
    background: var(--card);
    color: var(--text);
  }
  .toolbar input:focus, .toolbar select:focus,
  form input:focus, form select:focus, form textarea:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }

  .items {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1rem;
  }
  .item-card {
    background: var(--card);
    border-radius: 10px;
    padding: 1.1rem;
    box-shadow: 0 2px 8px rgba(11,31,66,0.08);
    border-left: 4px solid var(--border);
  }
  .item-card.lost { border-left-color: var(--lost); }
  .item-card.found { border-left-color: var(--found); }
  .item-card .tag {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
    margin-bottom: 0.6rem;
    letter-spacing: 0.03em;
  }
  .item-card.lost .tag { background: #fee2e2; color: var(--lost); }
  .item-card.found .tag { background: #dcfce7; color: var(--found); }
  .item-card h3 { font-size: 1.02rem; margin-bottom: 0.3rem; }
  .item-card p { font-size: 0.88rem; color: #334155; }
  .item-card .meta {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 0.6rem;
    padding-top: 0.5rem;
    border-top: 1px dashed var(--border);
  }
  .empty-state {
    text-align: center;
    padding: 2.5rem 1rem;
    color: var(--muted);
    background: var(--card);
    border-radius: 10px;
    border: 1px dashed var(--border);
  }

  .form-card {
    background: var(--card);
    border-radius: 12px;
    padding: 1.6rem;
    box-shadow: 0 2px 10px rgba(11,31,66,0.08);
    max-width: 560px;
    margin: 0 auto;
    border-top: 4px solid var(--yellow);
  }
  .form-card h2 { margin-bottom: 0.3rem; color: var(--navy); }
  .form-card .sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 1.2rem; }
  form label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 0.3rem;
    margin-top: 0.9rem;
  }
  form label:first-of-type { margin-top: 0; }
  form input, form select, form textarea {
    width: 100%;
    padding: 0.6rem 0.75rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 0.9rem;
    font-family: inherit;
    color: var(--text);
  }
  form textarea { resize: vertical; min-height: 70px; }
  .status-toggle {
    display: flex;
    gap: 0.6rem;
    margin-top: 0.4rem;
  }
  .status-toggle label {
    flex: 1;
    margin: 0;
    text-align: center;
    padding: 0.55rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .status-toggle input { display: none; }
  .status-toggle input:checked + span { color: white; }
  .status-toggle label:has(input:checked) { background: var(--lost); border-color: var(--lost); color: white; }
  .status-toggle label:has(input[value="found"]:checked) { background: var(--found); border-color: var(--found); }

  button.submit {
    margin-top: 1.4rem;
    width: 100%;
    background: var(--yellow);
    color: var(--navy);
    border: none;
    padding: 0.75rem;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button.submit:hover { background: var(--yellow-dark); }

  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--navy);
    color: var(--yellow);
    padding: 0.7rem 1.3rem;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer {
    text-align: center;
    padding: 1.5rem;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<header>
  <h1>Campus Lost &amp; Found Portal</h1>
  <p>Report a lost item or check what's been found around campus</p>
</header>

<nav>
  <button class="nav-btn active" data-view="browse">Browse Items</button>
  <button class="nav-btn" data-view="report">Report an Item</button>
</nav>

<main>

  <!-- BROWSE VIEW -->
  <section id="browse" class="view active">
    <div class="stats">
      <div class="stat-card"><div class="num" id="stat-lost">0</div><div class="label">Lost Items</div></div>
      <div class="stat-card"><div class="num" id="stat-found">0</div><div class="label">Found Items</div></div>
      <div class="stat-card accent"><div class="num" id="stat-total">0</div><div class="label">Total Reports</div></div>
    </div>

    <div class="toolbar">
      <input type="text" id="search" placeholder="Search by item name or location...">
      <select id="filter-status">
        <option value="all">All Items</option>
        <option value="lost">Lost Only</option>
        <option value="found">Found Only</option>
      </select>
    </div>

    <div class="items" id="items-list"></div>
  </section>

  <!-- REPORT VIEW -->
  <section id="report" class="view">
    <div class="form-card">
      <h2>Report an Item</h2>
      <div class="sub">Fill in the details below to add it to the portal.</div>
      <form id="report-form">
        <label>Item Status</label>
        <div class="status-toggle">
          <label><input type="radio" name="status" value="lost" checked><span>Lost</span></label>
          <label><input type="radio" name="status" value="found"><span>Found</span></label>
        </div>

        <label for="item-name">Item Name</label>
        <input type="text" id="item-name" placeholder="e.g. Blue Water Bottle" required>

        <label for="item-location">Location</label>
        <input type="text" id="item-location" placeholder="e.g. Library, 2nd Floor" required>

        <label for="item-desc">Description</label>
        <textarea id="item-desc" placeholder="Any extra details that could help identify the item"></textarea>

        <label for="item-contact">Contact Info</label>
        <input type="text" id="item-contact" placeholder="Email or phone number" required>

        <button type="submit" class="submit">Submit Report</button>
      </form>
    </div>
  </section>

</main>

<footer>
  Campus Lost &amp; Found Portal &middot; Deployed via Terraform + Ansible + Docker
</footer>

<div class="toast" id="toast"></div>

<script type="module">
  // Core logic lives in src/items.js so it can be unit tested in CI.
  import {
    filterItems,
    computeStats,
    validateReport,
    buildItem,
    escapeHtml,
  } from "./src/items.js";

  const STORAGE_KEY = "lostFoundItems";

  const seedItems = [
    { status: "lost", name: "Blue Water Bottle", location: "Library, 2nd Floor", desc: "Steel bottle with a sticker on the side.", contact: "reported earlier", time: "2 days ago" },
    { status: "found", name: "Student ID Card", location: "Main Cafeteria", desc: "Found near the entrance.", contact: "reported earlier", time: "1 day ago" },
    { status: "lost", name: "Black Wired Earphones", location: "CS Lab, Row 3", desc: "Misplaced during lab session.", contact: "reported earlier", time: "4 hours ago" },
    { status: "found", name: "Grey Umbrella", location: "Seminar Hall", desc: "Left behind after workshop.", contact: "reported earlier", time: "6 hours ago" }
  ];

  function loadItems() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(seedItems));
    return seedItems;
  }

  function saveItems(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  let items = loadItems();

  function renderItems() {
    const filtered = filterItems(items, {
      search: document.getElementById("search").value,
      status: document.getElementById("filter-status").value,
    });

    const list = document.getElementById("items-list");
    list.innerHTML = "";

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-state">No items match your search.</div>';
    } else {
      filtered.slice().reverse().forEach(item => {
        const card = document.createElement("div");
        card.className = "item-card " + item.status;
        card.innerHTML = `
          <span class="tag">${item.status}</span>
          <h3>${escapeHtml(item.name)}</h3>
          <p>${escapeHtml(item.desc || "No additional description.")}</p>
          <div class="meta">${escapeHtml(item.location)} &middot; ${escapeHtml(item.time)}</div>
        `;
        list.appendChild(card);
      });
    }

    const stats = computeStats(items);
    document.getElementById("stat-lost").textContent = stats.lost;
    document.getElementById("stat-found").textContent = stats.found;
    document.getElementById("stat-total").textContent = stats.total;
  }

  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);
  }

  // Navigation
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.view).classList.add("active");
    });
  });

  // Filters
  document.getElementById("search").addEventListener("input", renderItems);
  document.getElementById("filter-status").addEventListener("change", renderItems);

  // Report form
  document.getElementById("report-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = {
      status: document.querySelector('input[name="status"]:checked').value,
      name: document.getElementById("item-name").value,
      location: document.getElementById("item-location").value,
      desc: document.getElementById("item-desc").value,
      contact: document.getElementById("item-contact").value,
    };

    const { valid, errors } = validateReport(input);
    if (!valid) {
      showToast(Object.values(errors)[0]);
      return;
    }

    const status = input.status;
    items.push(buildItem(input));
    saveItems(items);
    renderItems();

    e.target.reset();
    showToast(status === "lost" ? "Lost item reported successfully" : "Found item reported successfully");

    document.querySelector('.nav-btn[data-view="browse"]').click();
  });

  renderItems();
</script>

</body>
</html>
