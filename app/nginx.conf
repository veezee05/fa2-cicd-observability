server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# Internal-only listener for metrics scraping.
# nginx-prometheus-exporter reads this and translates it into Prometheus
# metrics (connections, requests handled, etc.).
server {
    listen      8080;
    server_name _;

    location /stub_status {
        stub_status;
        access_log off;
    }
}
