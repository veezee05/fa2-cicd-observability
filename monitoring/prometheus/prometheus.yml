global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    service: lost-and-found

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Prometheus scraping itself — standard practice, and it means the
  # monitoring system can alert on its own health.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Host metrics: CPU, memory, disk, network.
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: ec2-web-host

  # Web server metrics: connections and requests handled.
  - job_name: nginx
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          instance: lost-and-found

  # ---- SLI collection -------------------------------------------------
  # Blackbox probes the application the way a user would. The results of
  # this job are the Service Level Indicators: probe_success gives
  # availability, probe_duration_seconds gives latency.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://app:80/
          - http://app:80/src/items.js
    relabel_configs:
      # Pass the target through to blackbox as a query parameter...
      - source_labels: [__address__]
        target_label: __param_target
      # ...keep the real target as the instance label...
      - source_labels: [__param_target]
        target_label: instance
      # ...and point the actual scrape at the exporter.
      - target_label: __address__
        replacement: blackbox-exporter:9115
