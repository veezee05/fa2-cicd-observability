# Alert rules.
#
# The first group is SLO-based: alerts fire because the service is failing
# its stated objective, not because a machine-level number looks unusual.
# That ordering is deliberate — symptom-based alerting is the SRE practice;
# cause-based alerting is the fallback.

groups:
  # ================================================== SLO / symptom alerts
  - name: slo-alerts
    rules:
      # SLI: probe_success. SLO: 99% availability.
      - alert: ApplicationDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 1m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "Lost & Found portal is not responding"
          description: >-
            {{ $labels.instance }} has failed its HTTP probe for over a minute.
            Users cannot reach the application. This burns the availability
            error budget directly.
          runbook: "docs/SRE.md#incident-application-down"

      # SLI: probe_duration_seconds. SLO: 95% of requests under 1 second.
      - alert: HighResponseLatency
        expr: probe_duration_seconds{job="blackbox-http"} > 1
        for: 5m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "Response time above the 1s latency objective"
          description: >-
            {{ $labels.instance }} has taken {{ $value | humanizeDuration }}
            to respond for 5 minutes, breaching the latency SLO.

      # Error budget burn: availability over the last 30 minutes below target.
      - alert: AvailabilityErrorBudgetBurn
        expr: avg_over_time(probe_success{job="blackbox-http"}[30m]) < 0.99
        for: 2m
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: "Availability error budget is burning"
          description: >-
            30-minute availability for {{ $labels.instance }} is
            {{ $value | humanizePercentage }}, below the 99% objective.
            At this rate the monthly error budget will be exhausted early.

  # ============================================ infrastructure / cause alerts
  - name: host-alerts
    rules:
      - alert: HostHighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU above 85% on {{ $labels.instance }}"
          description: "CPU has averaged {{ $value | printf \"%.1f\" }}% for 5 minutes."

      - alert: HostLowMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Less than 15% memory available on {{ $labels.instance }}"
          description: "{{ $value | printf \"%.1f\" }}% memory remaining."

      - alert: HostLowDisk
        expr: (node_filesystem_avail_bytes{mountpoint="/host"} / node_filesystem_size_bytes{mountpoint="/host"}) * 100 < 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Less than 15% disk free on {{ $labels.instance }}"
          description: "{{ $value | printf \"%.1f\" }}% disk remaining."

  # ===================================== monitoring system's own health
  - name: meta-alerts
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }}"
          description: >-
            Target {{ $labels.instance }} in job {{ $labels.job }} has been
            unreachable for 2 minutes. Metrics for it are now blind.
